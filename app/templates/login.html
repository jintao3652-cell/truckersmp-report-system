{% extends "base.html" %}{% block content %}<h1 class="h4 mb-3">{{ t('login') }}</h1><form method="post">{{ form.hidden_tag() }}<div class="mb-3"><label class="form-label">{{ t('username') }}</label>{{ form.username_or_email(class="form-control") }}</div><div class="mb-3"><label class="form-label">{{ t('password') }}</label>{{ form.password(class="form-control") }}</div><div class="form-check mb-3">{{ form.remember(class="form-check-input") }}<label class="form-check-label">{{ t('remember_me') }}</label></div><button class="btn btn-primary">{{ t('login') }}</button></form><a href="{{ url_for('auth.reset_request') }}">{{ t('forgot_password') }}</a>{% endblock %}
