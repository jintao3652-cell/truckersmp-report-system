{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">管理后台</h1>
<div class="list-group">
  {% for video in videos %}
    <div class="list-group-item">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ video.title }}</strong><br>
          <small class="text-muted">{{ video.report_id }} / {{ video.status }}</small>
        </div>
        <div class="btn-group">
          <form method="post" action="{{ url_for('admin.approve', video_id=video.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-success" type="submit">通过</button></form>
          <form method="post" action="{{ url_for('admin.reject', video_id=video.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-danger" type="submit">拒绝</button></form>
        </div>
      </div>
    </div>
  {% else %}
    <div class="text-muted">暂无待处理项目。</div>
  {% endfor %}
</div>
{% endblock %}
