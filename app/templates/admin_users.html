{% extends "base.html" %}{% block content %}<h1>用户管理</h1><table class="table"><tr><th>用户</th><th>邮箱</th><th>状态</th><th>操作</th></tr>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ user.email }}</td><td>{{ '禁用上传' if user.upload_disabled else '可上传' }}{% if user.locked_until %} / 已锁定{% endif %}</td><td><form method="post" action="{{ url_for('admin.toggle_upload', user_id=user.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-warning">切换上传</button></form><form method="post" action="{{ url_for('admin.unlock_user', user_id=user.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-success">解锁</button></form></td></tr>{% endfor %}</table>{% endblock %}
