{% extends "base.html" %}{% block content %}<h1>审核历史</h1><table class="table"><tr><th>时间</th><th>视频</th><th>管理员</th><th>操作</th><th>来源</th><th>原因</th></tr>{% for item in audits %}<tr><td>{{ item.created_at }}</td><td>{{ item.video_id or '已删除' }}</td><td>{{ item.admin.username if item.admin else item.admin_id }}</td><td>{{ item.action }}</td><td>{{ item.source }}</td><td>{{ item.reason }}</td></tr>{% endfor %}</table>{% endblock %}
